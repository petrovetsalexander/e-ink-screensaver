[versions]
agp = "8.9.2"
kotlin = "2.1.20"

# androidx/material versions below are the newest that still build against
# compileSdk 34. Anything newer (core-ktx 1.15+, activity 1.10+, appcompat 1.7.1+)
# forces compileSdk 35 and will fail the build with a "requires compileSdk 35" error.
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.3.2"

# Lifts Android's hidden-API restriction so EinkCompat can reflect into the
# vendor xrz framework. Standalone library — needs neither root nor the LSPosed
# framework installed.
hiddenapibypass = "6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
hiddenapibypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenapibypass" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
